{% extends "base.html" %}
{% block title %}{{ quiz.title }}{% endblock %}
{% block content %}
<div class="quiz-header">
    <h1>{{ quiz.title }}</h1>
    <p>{{ quiz.description }}</p>
    <p><strong>Time left:</strong> <span id="timer"></span></p>
</div>

<form id="quizForm" method="POST" action="{{ url_for('submit_quiz', quiz_id=quiz.id) }}">
{% for q in questions %}
<section class="question-card">
    <h2>Question {{ loop.index }} of {{ questions|length }}</h2>
    <p>{{ q.question_text }}</p>

    <label class="option">
        <input type="radio" name="question_{{ q.id }}" value="A">
        A. {{ q.option_a }}
    </label>
    <label class="option">
        <input type="radio" name="question_{{ q.id }}" value="B">
        B. {{ q.option_b }}
    </label>
    <label class="option">
        <input type="radio" name="question_{{ q.id }}" value="C">
        C. {{ q.option_c }}
    </label>
    <label class="option">
        <input type="radio" name="question_{{ q.id }}" value="D">
        D. {{ q.option_d }}
    </label>
</section>
{% endfor %}

<button class="btn" type="submit">Submit Quiz</button>
</form>

<script>
let remainingSeconds = {{ quiz.time_limit }} * 60;
const timerElement = document.getElementById("timer");
const form = document.getElementById("quizForm");

function updateTimer() {
    const minutes = Math.floor(remainingSeconds / 60);
    const seconds = remainingSeconds % 60;
    timerElement.textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

    if (remainingSeconds <= 0) {
        form.submit();
        return;
    }

    remainingSeconds--;
}

updateTimer();
setInterval(updateTimer, 1000);
</script>
{% endblock %}
