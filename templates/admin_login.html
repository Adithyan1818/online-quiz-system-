{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Admin Login</h1>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button class="btn" type="submit">Admin Login</button>
    </form>
</div>
{% endblock %}
