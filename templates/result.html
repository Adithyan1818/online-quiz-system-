{% extends "base.html" %}
{% block title %}Quiz Result{% endblock %}
{% block content %}
<div class="result-card">
    <h1>Quiz Result</h1>
    <h2>{{ result.quiz_title }}</h2>
    <p><strong>Student:</strong> {{ result.user_name }}</p>
    <p class="big-score">{{ result.score }} / {{ result.total_marks }}</p>
    <p class="percentage">{{ result.percentage }}%</p>
    <a class="btn" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    <a class="btn secondary" href="{{ url_for('previous_results') }}">Previous Results</a>
</div>
{% endblock %}
