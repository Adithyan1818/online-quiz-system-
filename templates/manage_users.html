{% extends "base.html" %}
{% block title %}Manage Users{% endblock %}
{% block content %}
<h1>Manage Users</h1>
<table>
    <thead>
        <tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th></tr>
    </thead>
    <tbody>
    {% for user in users %}
        <tr>
            <td>{{ user.name }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>{{ user.created_at }}</td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
